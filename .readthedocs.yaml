# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details
version: 2
build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
  jobs:
    # docs/api_c.rst is generated from the C headers and is not committed
    pre_build:
      - python bin/update-docs.py --api-only
sphinx:
  configuration: docs/conf.py
python:
  install:
   - requirements: docs/requirements.txt
