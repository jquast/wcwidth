name: CI

on:
  push:
    branches: [master]
    tags: ["*"]
  pull_request:
    branches: [master]
  schedule:
    - cron: "30 16 1 * *"
  workflow_dispatch:

env:
  # https://force-color.org/
  FORCE_COLOR: "1"
  # https://pip.pypa.io/en/stable/topics/configuration/#environment-variables
  # https://pip.pypa.io/en/stable/cli/pip/#cmdoption-disable-pip-version-check
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    continue-on-error: true  # Allow linting to fail without blocking CI

    strategy:
      fail-fast: false
      matrix:
        include:
          # docformatter on 3.13 (not yet compatible with 3.14)
          - python-version: '3.13'
            toxenv: docformatter_check
            label: docformatter

          # All other linting tools on 3.13
          - python-version: '3.13'
            toxenv: flake8,flake8_tests,isort_check,pydocstyle,pylint,pylint_tests,codespell,docs,clang_format_check
            label: Linting

          # Type checking with mypy on 3.14
          - python-version: '3.14'
            toxenv: mypy
            label: mypy

          # Packaging metadata and README render
          - python-version: '3.14'
            toxenv: twine_check
            label: twine check

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install tox
        run: python -Im pip install tox

      - name: Run linting
        run: python -Im tox -e ${{ matrix.toxenv }}

  tests:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        python-version:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"

    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          cache: pip
        if: '! matrix.container'

      - name: Prepare tox
        shell: bash
        run: |
          V=${{ matrix.python-version }}
          V=py$(echo $V | tr -d .)
          echo TOX_PYTHON=$V >>$GITHUB_ENV
          python -Im pip install tox

      - name: Build wheel to test against
        shell: bash
        run: |
          python -Im pip install build
          python -Im build

      - name: Fetch test data files
        if: matrix.python-version == '3.14' && matrix.os == 'ubuntu-latest'
        continue-on-error: true
        shell: bash
        run: |
          python -Im tox -e fetch

      - name: Run tests
        shell: bash
        run: |
          python -Im tox -e ${{ env.TOX_PYTHON }} --installpkg dist/wcwidth-*.whl

      - name: Rename coverage data
        shell: bash
        run: |
          if test -f .coverage; then
            mv .coverage{,.${{ matrix.os }}.${{ env.TOX_PYTHON }}.$(date +"%Y-%m-%d_%H%M%S")}
          fi

      - name: Upload coverage data
        uses: actions/upload-artifact@v7
        with:
          name: coverage-data.${{ matrix.os }}-${{ matrix.python-version }}
          path: .coverage.*
          include-hidden-files: true
          if-no-files-found: ignore

  # The wheel built here carries the C extension, but WCWIDTH_PYTHON=1 (set by the tox env)
  # forces the Python implementation, keeping it exercised and covered.
  tests-python:
    name: Python tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.15']

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          cache: pip

      - name: Prepare tox
        shell: bash
        run: |
          V=${{ matrix.python-version }}
          V=py$(echo $V | tr -d .)
          echo TOX_PYTHON=$V >>$GITHUB_ENV
          python -Im pip install tox

      - name: Build wheel to test against
        shell: bash
        run: |
          python -Im pip install build
          python -Im build

      - name: Run tests (Python implementation)
        shell: bash
        run: |
          python -Im tox -e ${{ env.TOX_PYTHON }}-python --installpkg dist/wcwidth-*.whl

      - name: Rename coverage data
        shell: bash
        run: |
          if test -f .coverage; then
            mv .coverage{,.${{ matrix.python-version }}.$(date +"%Y-%m-%d_%H%M%S")}
          fi

      - name: Upload coverage data
        uses: actions/upload-artifact@v7
        with:
          name: coverage-data.python-${{ matrix.python-version }}
          path: .coverage.*
          include-hidden-files: true
          if-no-files-found: ignore

  # libwcwidth/ ships in the source package (see MANIFEST.in), so a user installing from sdist
  # compiles the extension from it.  Build and test from the extracted sdist alone, proving it
  # carries everything that requires: the C sources and headers, setup.py, tox.ini and tests/.
  sdist:
    name: Source package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip

      - name: Build and extract sdist
        shell: bash
        run: |
          python -Im pip install build tox
          python -Im build --sdist

          mkdir source-dir
          tar -xzf dist/wcwidth-*.tar.gz -C source-dir --strip-components=1

      - name: Verify libwcwidth is distributed
        shell: bash
        working-directory: source-dir
        run: |
          # A silent drop from MANIFEST.in would otherwise surface as an install failure for
          # anyone without a matching wheel.
          test -f libwcwidth/CMakeLists.txt
          test -f libwcwidth/Makefile
          test -f libwcwidth/include/wcwidth/wcwidth_config.h
          ls libwcwidth/src/*.c >/dev/null
          ls libwcwidth/src/tables/*.c >/dev/null

      - name: Build and test from the source package
        shell: bash
        working-directory: source-dir
        run: |
          python -Im tox -e py314

  # Sanitizers instrument the C extension; the Python-free valgrind run lives in the
  # libwcwidth job below.
  sanitize:
    name: ASan/UBSan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip

      - name: Install tox
        run: python -Im pip install tox

      - name: Run tests under AddressSanitizer
        run: python -Im tox -e asan

  # The C11 library builds and tests along with, but not (yet) as a Python extension
  libwcwidth:
    name: libwcwidth (C11)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build and test with make
        run: make -C libwcwidth test

      - name: Build and test with CMake
        run: |
          cmake -B libwcwidth/build-cmake -S libwcwidth
          cmake --build libwcwidth/build-cmake
          ctest --test-dir libwcwidth/build-cmake --output-on-failure

      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind

      - name: Run C tests under valgrind
        run: make -C libwcwidth valgrind

  # Instrumented C coverage.  The C11 and Python coverage are merged into a single gcov report and
  # uploaded for a combined Codecov total.
  libwcwidth-coverage:
    name: libwcwidth coverage (C11)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip

      - name: Install tox
        run: python -Im pip install tox

      - name: Measure libwcwidth coverage
        run: python -Im tox -e c_coverage

      - name: Upload C coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-c
          path: coverage-c.lcov
          if-no-files-found: error

  coverage:
    name: Combine & check coverage.
    runs-on: ubuntu-latest
    needs: [tests, tests-python, libwcwidth-coverage]

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version-default
          cache: pip

      - name: Merge coverage data artifacts
        uses: actions/upload-artifact/merge@v7
        with:
          name: coverage-data
          pattern: coverage-data.*
          include-hidden-files: true
          delete-merged: true

      - name: Download coverage data
        uses: actions/download-artifact@v8
        with:
          name: coverage-data

      - name: Download C coverage
        uses: actions/download-artifact@v8
        with:
          name: coverage-c

      - name: Combine coverage data
        run: |
          python -Im pip install coverage[toml]

          python -Im coverage combine
          python -Im coverage html --skip-covered --skip-empty
          python -Im coverage xml

          # Report and write to summary.
          python -Im coverage report --format=markdown >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          # coverage.py (Python) and gcovr (C, libwcwidth) merge into one total.
          files: ./coverage.xml,./coverage-c.lcov
          fail_ci_if_error: true
          verbose: true

      - name: Fail if coverage is <100%.
        run: |
          # Report again and fail if under 100%.
          python -Im coverage report --fail-under=100

      - name: Upload HTML report if check failed.
        uses: actions/upload-artifact@v7
        with:
          name: html-report
          path: htmlcov
        if: ${{ failure() }}
