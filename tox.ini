[tox]
envlist = update, fetch, compile, autopep8, docformatter, docformatter_check, isort, isort_check, pylint, pylint_tests, flake8, flake8_tests, pydocstyle, mypy, codespell, twine_check, format, lint, docs, verify_tables, py{39, 310, 311, 312, 313, 314}, py39-python, py315-python
skip_missing_interpreters = true

[base]
pip_compile_command = pip-compile --resolver=backtracking --strip-extras --no-emit-index-url --allow-unsafe --upgrade

[testenv]
deps = -r requirements-tests39.txt
       setuptools
setenv = TERM=
         TERM_PROGRAM=
commands = {envpython} -m pytest --cov-config={toxinidir}/tox.ini {posargs:\
             --verbose \
             --junit-xml=.tox/results.{envname}.xml \
             --durations=10 \
             } \
          --log-format='%(levelname)s %(relativeCreated)2.2f %(filename)s:%(lineno)d %(message)s' \
          tests wcwidth
passenv = TEST_QUICK,TEST_KEYBOARD,TEST_RAW,FULL_TESTING,CI


[isort]
line_length = 100
indent = '    '
multi_line_output = 1
length_sort = 1
import_heading_stdlib = std imports
import_heading_thirdparty = 3rd party
import_heading_firstparty = local
import_heading_localfolder = local
sections=FUTURE,STDLIB,TYPING_STDLIB,THIRDPARTY,FIRSTPARTY,LOCALFOLDER
no_lines_before=LOCALFOLDER
known_first_party = wcwidth
known_third_party = codecov,blessed
known_typing_stdlib = typing,typing_extensions
atomic = true

[pytest]
norecursedirs = .git .tox build
# testpaths prevents walking bin/, docs/ and setup.py for --doctest-modules
testpaths = tests wcwidth
addopts = --disable-pytest-warnings
          --cov-append --cov-report=html --color=yes --ignore=.tox
          --cov=wcwidth
          --doctest-modules
          --ignore=wcwidth/wcwidth.py
filterwarnings =
    error
    # pygments calls os.path.commonprefix(), deprecated in Python 3.15. It is reached only
    # from pytest's syntax highlighting of failure output, where 'error' turns a failing
    # test into an INTERNALERROR that hides which test failed.
    ignore:os\.path\.commonprefix\(\) is deprecated:DeprecationWarning
junit_family = xunit1

[flake8]
exclude = .tox,build
extend-exclude = *.c
max-line-length = 100
ignore = E402,E501,F401,W503,W504

[coverage:run]
branch = True
source = wcwidth
parallel = True
relative_files = True

[coverage:report]
omit = tests/*
       wcwidth/table_grapheme_overrides/_known_*
       wcwidth/table_grapheme_overrides/_registry.py
exclude_lines = pragma: no cover
precision = 1

[coverage:paths]
source = wcwidth/

[testenv:compile]
basepython = python3.14
commands = python -m compileall {toxinidir}/wcwidth {toxinidir}/bin {toxinidir}/tests {toxinidir}/docs

# wcwidth itself has no 3rd party dependencies, but to ensure the best available
# version for the newest to oldest python versions for testing, must also use some
# targeted versions to 'compile' those requirements into their frozen form,
# otherwise incompatible packages can be pinned.
[testenv:update_requirements_update]
basepython = python3.14
deps = pip-tools
commands = {[base]pip_compile_command} requirements-update.in -o requirements-update.txt

[testenv:update_requirements_docs]
basepython = python3.14
deps = pip-tools
commands = {[base]pip_compile_command} requirements-docs.in -o docs/requirements.txt

[testenv:update_requirements39]
basepython = python3.9
deps = pip-tools
commands = {[base]pip_compile_command} requirements-tests39.in -o requirements-tests39.txt

[testenv:update_requirements_wheels]
basepython = python3.14
deps = pip-tools
commands = {[base]pip_compile_command} requirements-wheels.in -o requirements-wheels.txt

[testenv:py{39,310,311,312,313,314,315}]
# 'python -m pytest' places the current directory at the head of sys.path, so a run started from
# the repository root imports wcwidth/ from the source tree rather than from the installed package,
# where the extension lives.  Build it in-place, so that extension mode exercises C instead of
# silently falling back to Python.  The '-python' environments below need no such build.
#
# Calling setup.py directly bypasses PEP 517, so this builds against whatever setuptools the
# environment holds, as does any source build that opts out of build isolation; setup.py copes
# with an old one on its own.
commands_pre = {envpython} setup.py build_ext --inplace

[testenv:py39-python]
deps = -r requirements-tests39.txt
setenv = TERM=
         TERM_PROGRAM=
         WCWIDTH_PYTHON = 1

[testenv:py315-python]
setenv = TERM=
         TERM_PROGRAM=
         WCWIDTH_PYTHON = 1

[testenv:asan]
# Rebuild the C extension with AddressSanitizer + UndefinedBehaviorSanitizer
# and run tests with the sanitizer runtimes.  LD_PRELOAD and libasan.so are ELF
# mechanisms, so the env is skipped anywhere else (CI runs it on ubuntu-latest).
platform = linux
basepython = python3.14
usedevelop = true
allowlist_externals = bash
setenv = TERM=
         TERM_PROGRAM=
         PYTHONMALLOC = malloc
         CFLAGS = -fsanitize=address,undefined -fno-omit-frame-pointer -g -O1
         LDFLAGS = -fsanitize=address,undefined
         ASAN_OPTIONS = detect_leaks=1:halt_on_error=1
         UBSAN_OPTIONS = halt_on_error=1
commands_pre =
    {envpython} setup.py build_ext --inplace --force
commands =
    bash -c 'set -e; export LD_PRELOAD=$({env:CC:cc} -print-file-name=libasan.so); {envpython} -c "import wcwidth, wcwidth._wcwidth_c as m; assert wcwidth.HAS_C_EXTENSION, \"C extension not built; see the build log\"; blob = open(m.__file__, \"rb\").read(); assert b\"__asan_\" in blob and b\"__ubsan_\" in blob, \"C extension is not instrumented; CFLAGS did not reach the compiler\""; exec {envpython} -m pytest --cov-config={toxinidir}/tox.ini {posargs:--verbose --durations=10} --no-cov tests'
# commands_post runs even when the command above fails.  The in-place extension carries
# this env's sanitizer flags, so a later `import wcwidth` from this tree aborts unless
# libasan is preloaded; rebuild without them so the tree is left usable.
commands_post =
    {envpython} -c "import os, subprocess, sys; os.environ.pop('CFLAGS', None); os.environ.pop('LDFLAGS', None); sys.exit(subprocess.call([sys.executable, 'setup.py', 'build_ext', '--inplace', '--force']))"

[testenv:c_coverage]
# libwcwidth's coverage, which coverage.py cannot see: the C is compiled.  Two
# instrumented runs feed one report -- the C11 suite (CMake/ctest), and the Python
# suite driving the CPython extension built from the same libwcwidth sources.  They
# reach different code, so the gcov data is merged rather than reported separately.
# Requires gcc: --coverage and -fprofile-abs-path are its flags.
# gcovr is pinned: its report options are renamed in every major release.
basepython = python3.14
usedevelop = true
deps = -r requirements-tests39.txt
       setuptools
       gcovr==8.6
allowlist_externals = cmake
                      ctest
                      mkdir
setenv = TERM=
         TERM_PROGRAM=
         CFLAGS = --coverage -fprofile-abs-path -O0 -g
         LDFLAGS = --coverage
commands_pre =
    {envpython} setup.py build_ext --inplace --force
commands =
    {envpython} -m pytest --no-cov -q tests wcwidth
    cmake -B {envtmpdir}/cmake -S {toxinidir}/libwcwidth -DCMAKE_C_FLAGS="--coverage -fprofile-abs-path -O0 -g"
    cmake --build {envtmpdir}/cmake --parallel
    ctest --test-dir {envtmpdir}/cmake --output-on-failure
    mkdir -p {toxinidir}/htmlcov-c
    gcovr {toxinidir}/build {envtmpdir}/cmake \
          --root {toxinidir} \
          --filter {toxinidir}/libwcwidth/src \
          --exclude {toxinidir}/libwcwidth/src/tables \
          --fail-under-line 89 \
          --txt \
          --lcov {toxinidir}/coverage-c.lcov \
          --html-details {toxinidir}/htmlcov-c/index.html
    {envpython} -c "import pathlib,re; p=pathlib.Path('{toxinidir}/coverage-c.lcov'); p.write_text(re.sub(r'(?m)^SF:.*?(?=libwcwidth/)', 'SF:', p.read_text()))"

[testenv:update]
basepython = python3.15
usedevelop = true
deps = -r requirements-update.txt
commands = python {toxinidir}/bin/update-tables.py {posargs:--fetch-all-versions}
           python {toxinidir}/bin/update-docs.py

[testenv:fetch]
basepython = python3.14
usedevelop = true
deps = -r requirements-update.txt
commands = - python {toxinidir}/bin/update-tables.py {posargs:--only-fetch}

[testenv:build-wheels]
# Build release wheels locally with the same tool and config CI uses. Requires
# Docker. Only the host OS's wheels are produced, matching CI's runner matrix.
#
# Narrow to one target while iterating, e.g.:
#   tox -e build-wheels -- --only cp313-manylinux_x86_64
#
# Bump cibuildwheel with `tox -e update_requirements_wheels`, and keep the
# Action tag in .github/workflows/wheels.yml in sync by hand.
basepython = python3.14
skip_install = true
deps = -r requirements-wheels.txt
allowlist_externals = docker, sh
commands_pre =
    # Register aarch64 binfmt handlers only when the host has none; installing
    # them from your distribution instead is documented in docs/intro.rst.
    - sh -c 'test -e /proc/sys/fs/binfmt_misc/qemu-aarch64 || docker run --rm --privileged tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0 --install arm64'
commands =
    cibuildwheel --output-dir {toxinidir}/wheelhouse {posargs}

[testenv:autopep8]
basepython = python3.14
deps = autopep8
commands =
    autopep8 \
        --in-place \
        --recursive \
        --aggressive \
        --aggressive \
        --max-line-length 100 \
        wcwidth/ bin/ tests/

[testenv:isort]
deps = isort==8.0.1
basepython = python3.13
commands = isort --quiet wcwidth tests bin

[testenv:pylint]
basepython = python3.13
deps = pylint==4.0.7
commands = pylint --rcfile={toxinidir}/.pylintrc \
           --ignore=tests,docs,conf.py,build,distutils,.pyenv,.git,.tox \
           {posargs:{toxinidir}}/wcwidth

[testenv:flake8]
basepython = python3.13
deps = flake8
commands = flake8 --exclude=tests docs/ wcwidth/ bin/ tests/

[testenv:docs]
# matches .readthedocs.yaml and environment
basepython = python3.14
deps = -r {toxinidir}/docs/requirements.txt
# docs/api_c.rst is generated from the C headers before sphinx reads it, here and by the pre_build
# job in .readthedocs.yaml.  Generating it needs neither the network nor the Unicode sources that
# the generator reads for its other outputs, hence --api-only.
commands = python {toxinidir}/bin/update-docs.py --api-only
           sphinx-build -W docs/ build/sphinx

[testenv:verify_tables]
basepython = python3.13
commands = python {toxinidir}/bin/verify-table-integrity.py

[testenv:linkcheck]
basepython = python3.11
deps = -r {toxinidir}/docs/requirements.txt
commands = sphinx-build -v -W -d {toxinidir}/docs/_build/doctrees -b linkcheck docs docs/_build/linkcheck

[testenv:codecov]
basepython = python{env:TOXPYTHON:{env:TRAVIS_PYTHON_VERSION:3.10}}
passenv = TOXENV,CI,TRAVIS,TRAVIS_*,CODECOV_*
deps = codecov
commands = codecov -e TOXENV

[testenv:pydocstyle]
basepython = python3.13
deps = pydocstyle
       doc8
       pygments
commands = pydocstyle --source --explain {toxinidir}/wcwidth
           doc8 --ignore-path docs/_build --ignore-path docs/requirements.txt --ignore D000 --max-line-length 100 docs

[testenv:docformatter]
basepython = python3.13
deps = docformatter==1.7.7
commands = docformatter --in-place --recursive --pre-summary-newline \
             --wrap-summaries=100 --wrap-descriptions=100 \
             {toxinidir}/wcwidth/ {toxinidir}/bin {toxinidir}/tests/

[testenv:docformatter_check]
basepython = python3.13
deps = {[testenv:docformatter]deps}
commands = docformatter --check --diff --recursive --pre-summary-newline \
           --wrap-summaries=100 --wrap-descriptions=100 \
           {toxinidir}/wcwidth/ {toxinidir}/bin {toxinidir}/tests/

[testenv:isort_check]
basepython = python3.14
deps = {[testenv:isort]deps}
commands = isort --diff --check-only wcwidth tests bin

[testenv:flake8_tests]
basepython = python3.14
deps = flake8
commands = flake8 --ignore=E501,W504,F401 tests/

[testenv:pylint_tests]
basepython = python3.13
deps = pytest
       {[testenv:pylint]deps}
# import-outside-toplevel: fixtures import wcwidth inside the fixture body
commands = pylint --rcfile={toxinidir}/.pylintrc \
           --disable=protected-access,unused-argument,missing-function-docstring,line-too-long,import-outside-toplevel \
           tests

[testenv:mypy]
basepython = python3.14
deps = mypy
commands = mypy --strict wcwidth

[mypy]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

[testenv:codespell]
basepython = python3.13
deps = codespell
# table_*.c are generated tables; their truncated Unicode name descriptions
# and script names (e.g. "Tai Tham") are not prose and cannot be spellchecked.
# nd/clen are idiomatic C variable names in libwcwidth; caf is the 'c','a','f'
# char literals of the CP437 "caf\x82" example in the libwcwidth docs.
commands = codespell --skip="*.pyc,htmlcov,_build,build,*.egg-info,.tox,data,./tests/*.txt,*.csv,*.ods,table_*.py,table_*.c,docs/specs.rst,*.isorted,ucs-detect" \
                     --ignore-words-list="thirdparty,claus,oclock,womens,aprox,tham,nd,clen,caf" \
                     --uri-ignore-words-list '*' \
                     --summary --count

[testenv:check_release]
# Pre-upload checks, run from a release tag before 'twine upload'; see
# "Release" in docs/developing.rst.  cibuildwheel is a dependency
# because the script asks it which wheels [tool.cibuildwheel] expects, rather
# than restating that matrix.  gh must be installed and authenticated.
basepython = python3.14
skip_install = true
deps = cibuildwheel
passenv = GH_TOKEN,GITHUB_TOKEN,HOME,XDG_CONFIG_HOME
commands = python {toxinidir}/bin/check-release.py {posargs}

[testenv:twine_check]
# Verify the built distributions the way upload.pypi.org does: 'twine check'
# runs the README through readme_renderer, which halts on any reStructuredText
# error (such as a reference with no matching target).  Neither doc8 (D000 is
# disabled) nor the python linters inspect README.rst.
basepython = python3.14
skip_install = true
deps = build
       twine
commands = python -m build --outdir {envtmpdir}/dist
           python -c "import glob, subprocess, sys; subprocess.check_call(['twine', 'check', '--strict'] + sorted(glob.glob(sys.argv[1] + '/dist/*')))" {envtmpdir}

[testenv:clang_format]
basepython = python3.14
skip_install = true
deps = clang-format==20.1.8
allowlist_externals = make
commands = make -C {toxinidir}/libwcwidth format

[testenv:clang_format_check]
basepython = python3.14
skip_install = true
deps = {[testenv:clang_format]deps}
allowlist_externals = make
commands = make -C {toxinidir}/libwcwidth format-check

[testenv:format]
basepython = python3.13
deps = {[testenv:isort]deps}
       {[testenv:docformatter]deps}
       {[testenv:autopep8]deps}
       {[testenv:clang_format]deps}
allowlist_externals = make
commands = {[testenv:isort]commands}
           {[testenv:docformatter]commands}
           {[testenv:autopep8]commands}
           {[testenv:clang_format]commands}

[testenv:lint]
basepython = python3.14
deps = {[testenv:flake8]deps}
       {[testenv:mypy]deps}
       {[testenv:isort_check]deps}
       {[testenv:pydocstyle]deps}
       {[testenv:pylint_tests]deps}
       {[testenv:codespell]deps}
       {[testenv:twine_check]deps}
       {[testenv:clang_format]deps}
allowlist_externals = make
commands = {[testenv:compile]commands}
	   {[testenv:flake8]commands}
           {[testenv:mypy]commands}
           {[testenv:pylint]commands}
           {[testenv:flake8_tests]commands}
           {[testenv:pylint_tests]commands}
           {[testenv:codespell]commands}
           {[testenv:pydocstyle]commands}
           {[testenv:isort_check]commands}
           {[testenv:clang_format_check]commands}
