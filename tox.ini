[tox]
envlist = update, fetch, compile, autopep8, docformatter, docformatter_check, isort, isort_check, pylint, pylint_tests, flake8, flake8_tests, pydocstyle, mypy, codespell, twine_check, format, lint, docs, verify_tables, py{38, 39, 310, 311, 312, 313, 314}, py38-python, py315-python
skip_missing_interpreters = true

[base]
pip_compile_command = pip-compile --resolver=backtracking --strip-extras --no-emit-index-url --allow-unsafe --upgrade

[testenv]
deps = -r requirements-tests39.txt
setenv = TERM=
         TERM_PROGRAM=
commands = {envpython} -m pytest --cov-config={toxinidir}/tox.ini {posargs:\
             --verbose \
             --junit-xml=.tox/results.{envname}.xml \
             --durations=10 \
             } \
          --log-format='%(levelname)s %(relativeCreated)2.2f %(filename)s:%(lineno)d %(message)s' \
          tests
passenv = TEST_QUICK,TEST_KEYBOARD,TEST_RAW


[isort]
line_length = 100
indent = '    '
multi_line_output = 1
length_sort = 1
import_heading_stdlib = std imports
import_heading_thirdparty = 3rd party
import_heading_firstparty = local
import_heading_localfolder = local
sections=FUTURE,STDLIB,TYPING_STDLIB,THIRDPARTY,FIRSTPARTY,LOCALFOLDER
no_lines_before=LOCALFOLDER
known_first_party = wcwidth
known_third_party = codecov,blessed
known_typing_stdlib = typing,typing_extensions
atomic = true

[pytest]
norecursedirs = .git .tox build
addopts = --disable-pytest-warnings
          --cov-append --cov-report=html --color=yes --ignore=.tox
          --cov=wcwidth
filterwarnings =
    error
junit_family = xunit1

[flake8]
exclude = .tox,build
extend-exclude = *.c
max-line-length = 100
ignore = E402,E501,F401,W503,W504

[coverage:run]
branch = True
source = wcwidth
parallel = True
relative_files = True

[coverage:report]
omit = tests/*
       wcwidth/table_grapheme_overrides/_known_*
       wcwidth/table_grapheme_overrides/_registry.py
exclude_lines = pragma: no cover
precision = 1

[coverage:paths]
source = wcwidth/

[testenv:compile]
basepython = python3.14
commands = python -m compileall {toxinidir}/wcwidth {toxinidir}/bin {toxinidir}/tests {toxinidir}/docs

# wcwidth itself has no 3rd party dependencies, but to ensure the best available
# version for the newest to oldest python versions for testing, must also use some
# targeted versions to 'compile' those requirements into their frozen form,
# otherwise incompatible packages can be pinned.
[testenv:update_requirements_update]
basepython = python3.14
deps = pip-tools
commands = {[base]pip_compile_command} requirements-update.in -o requirements-update.txt

[testenv:update_requirements_docs]
basepython = python3.14
deps = pip-tools
commands = {[base]pip_compile_command} requirements-docs.in -o docs/requirements.txt

[testenv:update_requirements39]
basepython = python3.9
deps = pip-tools
commands = {[base]pip_compile_command} requirements-tests39.in -o requirements-tests39.txt

[testenv:update_requirements38]
basepython = python3.8
deps = pip-tools
commands = {[base]pip_compile_command} requirements-tests38.in -o requirements-tests38.txt

[testenv:update_requirements_wheels]
basepython = python3.14
deps = pip-tools
commands = {[base]pip_compile_command} requirements-wheels.in -o requirements-wheels.txt

[testenv:py38]
deps = -r requirements-tests38.txt

# Python-only runs: force WCWIDTH_PYTHON so the C extension is never
# imported, keeping the Python implementation exercised (and covered) in CI.
# Only the earliest and latest supported Python are run this way.
[testenv:py38-python]
deps = -r requirements-tests38.txt
setenv = TERM=
         TERM_PROGRAM=
         WCWIDTH_PYTHON = 1

[testenv:py315-python]
setenv = TERM=
         TERM_PROGRAM=
         WCWIDTH_PYTHON = 1

[testenv:asan]
# Rebuild the C extension with AddressSanitizer + UndefinedBehaviorSanitizer
# and run the full test suite under the sanitizer runtimes.  Python itself is
# not instrumented, so libasan is preloaded for the interpreter; the preload
# is verified before the suite runs, since ASan silently no-ops otherwise.
# Recreate this environment ('tox -e asan --recreate') after changing CFLAGS.
basepython = python3.14
usedevelop = true
allowlist_externals = bash
setenv = TERM=
         TERM_PROGRAM=
         PYTHONMALLOC = malloc
         CFLAGS = -fsanitize=address,undefined -fno-omit-frame-pointer -g -O1
         LDFLAGS = -fsanitize=address,undefined
         ASAN_OPTIONS = detect_leaks=1:halt_on_error=1
         UBSAN_OPTIONS = halt_on_error=1
commands_pre =
    {envpython} -c "import wcwidth; assert wcwidth.HAS_C_EXTENSION, 'C extension not built; see the pip build log'"
commands =
    bash -c 'export LD_PRELOAD=$(gcc -print-file-name=libasan.so); {envpython} -c "import os; assert \"libasan\" in open(\"/proc/self/maps\").read(), \"libasan not preloaded\""; exec {envpython} -m pytest --cov-config={toxinidir}/tox.ini {posargs:--verbose --durations=10} --no-cov tests'

[testenv:update]
# it is best to use latest python for latest 'unicodedata' for named table items in generated code
basepython = python3.15
usedevelop = true
deps = -r requirements-update.txt
commands = python {toxinidir}/bin/update-tables.py {posargs:--fetch-all-versions}
           python {toxinidir}/bin/update-docs.py

[testenv:fetch]
basepython = python3.14
usedevelop = true
deps = -r requirements-update.txt
commands = - python {toxinidir}/bin/update-tables.py {posargs:--only-fetch}

[testenv:build-wheels]
# Build release wheels locally with the exact same tool and config CI uses
# ([tool.cibuildwheel] in pyproject.toml), including musllinux and, on
# Linux, aarch64 via QEMU emulation -- the same manylinux/musllinux Docker
# images cibuildwheel pulls in CI are pulled here too. Requires Docker.
#
# cibuildwheel infers the platform from the host OS, so a single run only
# produces that OS's wheels (Linux: manylinux + musllinux, x86_64 +
# aarch64 via QEMU; macOS: the macOS wheels; Windows: the Windows wheels)
# -- matching CI's per-OS runner matrix, it cannot cross-build other OSes.
#
# Narrow to one target while iterating, e.g.:
#   tox -e build-wheels -- --only cp313-manylinux_x86_64
#
# cibuildwheel's version is locked in requirements-wheels.txt (see
# requirements-wheels.in for why it is frozen below v3.0), the same
# pip-compile flow as every other pinned dependency in this project; bump it
# with `tox -e update_requirements_wheels`, not by hand-editing the .txt.
# .github/workflows/wheels.yml pins the same version via the Action tag
# (pypa/cibuildwheel@vX.Y), which is a separate mechanism pip-compile can't
# reach -- keep the two in sync by hand.
basepython = python3.14
skip_install = true
deps = -r requirements-wheels.txt
allowlist_externals = docker
commands_pre =
    - docker run --rm --privileged tonistiigi/binfmt --install all
commands =
    cibuildwheel --output-dir {toxinidir}/wheelhouse {posargs}

[testenv:autopep8]
basepython = python3.14
deps = autopep8
commands =
    autopep8 \
        --in-place \
        --recursive \
        --aggressive \
        --aggressive \
        --max-line-length 100 \
        wcwidth/ bin/ tests/

[testenv:isort]
deps = isort==8.0.1
basepython = python3.13
commands = isort --quiet wcwidth tests bin

[testenv:pylint]
basepython = python3.13
deps = pylint==4.0.7
commands = pylint --rcfile={toxinidir}/.pylintrc \
           --ignore=tests,docs,conf.py,build,distutils,.pyenv,.git,.tox \
           {posargs:{toxinidir}}/wcwidth

[testenv:flake8]
basepython = python3.13
deps = flake8
commands = flake8 --exclude=tests docs/ wcwidth/ bin/ tests/

[testenv:docs]
# matches .readthedocs.yaml and environment
basepython = python3.14
deps = -r {toxinidir}/docs/requirements.txt
commands = sphinx-build -W docs/ build/sphinx

[testenv:verify_tables]
basepython = python3.13
commands = python {toxinidir}/bin/verify-table-integrity.py

[testenv:linkcheck]
basepython = python3.11
deps = -r {toxinidir}/docs/requirements.txt
commands = sphinx-build -v -W -d {toxinidir}/docs/_build/doctrees -b linkcheck docs docs/_build/linkcheck

[testenv:codecov]
basepython = python{env:TOXPYTHON:{env:TRAVIS_PYTHON_VERSION:3.10}}
passenv = TOXENV,CI,TRAVIS,TRAVIS_*,CODECOV_*
deps = codecov
commands = codecov -e TOXENV

[testenv:pydocstyle]
basepython = python3.13
deps = pydocstyle
       doc8
       pygments
commands = pydocstyle --source --explain {toxinidir}/wcwidth
           doc8 --ignore-path docs/_build --ignore-path docs/requirements.txt --ignore-path docs/api_c.rst --ignore D000 --max-line-length 100 docs

[testenv:docformatter]
basepython = python3.13
deps = docformatter==1.7.7
commands = docformatter --in-place --recursive --pre-summary-newline \
             --wrap-summaries=100 --wrap-descriptions=100 \
             {toxinidir}/wcwidth/ {toxinidir}/bin {toxinidir}/tests/

[testenv:docformatter_check]
basepython = python3.13
deps = {[testenv:docformatter]deps}
commands = docformatter --check --diff --recursive --pre-summary-newline \
           --wrap-summaries=100 --wrap-descriptions=100 \
           {toxinidir}/wcwidth/ {toxinidir}/bin {toxinidir}/tests/

[testenv:isort_check]
basepython = python3.14
deps = {[testenv:isort]deps}
commands = isort --diff --check-only wcwidth tests bin

[testenv:flake8_tests]
basepython = python3.14
deps = flake8
commands = flake8 --ignore=E501,W504,F401 tests/

[testenv:pylint_tests]
basepython = python3.13
deps = pytest
       {[testenv:pylint]deps}
# import-outside-toplevel: fixtures import wcwidth inside the fixture body
commands = pylint --rcfile={toxinidir}/.pylintrc \
           --disable=protected-access,unused-argument,missing-function-docstring,line-too-long,import-outside-toplevel \
           tests

[testenv:mypy]
basepython = python3.14
deps = mypy
commands = mypy --strict wcwidth

[mypy]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

[testenv:codespell]
basepython = python3.13
deps = codespell
# table_*.c are generated tables; their truncated Unicode name descriptions
# and script names (e.g. "Tai Tham") are not prose and cannot be spellchecked.
# nd/clen are idiomatic C variable names in libwcwidth; caf is the 'c','a','f'
# char literals of the CP437 "caf\x82" example in the libwcwidth docs.
commands = codespell --skip="*.pyc,htmlcov,_build,build,*.egg-info,.tox,data,./tests/*.txt,*.csv,*.ods,table_*.py,table_*.c,docs/specs.rst,*.isorted,ucs-detect" \
                     --ignore-words-list="thirdparty,claus,oclock,womens,aprox,tham,nd,clen,caf" \
                     --uri-ignore-words-list '*' \
                     --summary --count

[testenv:twine_check]
# Verify the built distributions the way upload.pypi.org does: 'twine check'
# runs the README through readme_renderer, which halts on any reStructuredText
# error (such as a reference with no matching target).  Neither doc8 (D000 is
# disabled) nor the python linters inspect README.rst.
basepython = python3.14
skip_install = true
deps = build
       twine
commands = python -m build --outdir {envtmpdir}/dist
           python -c "import glob, subprocess, sys; subprocess.check_call(['twine', 'check', '--strict'] + sorted(glob.glob(sys.argv[1] + '/dist/*')))" {envtmpdir}

[testenv:format]
basepython = python3.13
deps = {[testenv:isort]deps}
       {[testenv:docformatter]deps}
       {[testenv:autopep8]deps}
commands = {[testenv:isort]commands}
           {[testenv:docformatter]commands}
           {[testenv:autopep8]commands}

[testenv:lint]
basepython = python3.14
deps = {[testenv:flake8]deps}
       {[testenv:mypy]deps}
       {[testenv:isort_check]deps}
       {[testenv:pydocstyle]deps}
       {[testenv:pylint_tests]deps}
       {[testenv:codespell]deps}
       {[testenv:twine_check]deps}
commands = {[testenv:compile]commands}
	   {[testenv:flake8]commands}
           {[testenv:mypy]commands}
           {[testenv:pylint]commands}
           {[testenv:flake8_tests]commands}
           {[testenv:pylint_tests]commands}
           {[testenv:codespell]commands}
           {[testenv:pydocstyle]commands}
           {[testenv:isort_check]commands}
