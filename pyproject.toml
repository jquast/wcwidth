[build-system]
# setuptools >= 61 is the first version reading [tool.setuptools] from
# pyproject.toml; the upper bound is the last one supporting Python 3.8
# (setuptools 77 dropped 3.8), which this package still supports.
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=61,<78", "wheel" ]

[project]
name = "wcwidth"
version = "0.9.0"  # stamped into __init__.py and wcwidth_config.h by bin/update-tables.py
description = "Measures the displayed width of unicode strings in a terminal"
readme = "README.rst"
keywords = [
  "cjk",
  "combining",
  "console",
  "eastasian",
  "emoji",
  "emulator",
  "terminal",
  "unicode",
  "wcswidth",
  "wcwidth",
  "xterm",
]
# No [project] license key: the pre-639 license *table* is deprecated as of
# setuptools 77, the PEP 639 SPDX string and license-files need setuptools>=77
# (which dropped Python 3.8, still supported here), and the table form is the
# only one setuptools<77 accepts.  setuptools>=77 auto-includes LICENSE in the
# wheel metadata; older versions rely on the license classifier below and on
# LICENSE in the sdist via MANIFEST.in.
authors = [
  { name = "Jeff Quast", email = "contact@jeffquast.com" },
]
requires-python = ">=3.8"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Software Development :: Internationalization",
  "Topic :: Software Development :: Libraries",
  "Topic :: Software Development :: Localization",
  "Topic :: Terminals",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/jquast/wcwidth"

# The C extension 'wcwidth._wcwidth_c' is optional: setup.py skips it when the
# build would fail (no compiler, PyPy, WCWIDTH_PYTHON=1) and the
# Python implementation is used instead.

[tool.setuptools]
include-package-data = false
packages = [
  "wcwidth",
  "wcwidth.table_grapheme_overrides",
]

[tool.setuptools.package-data]
wcwidth = [ "py.typed", "*.pyi" ]

# The optional C extension 'wcwidth._wcwidth_c' is declared in setup.py with
# the classic ext_modules API (see there for why, and for the graceful
# fallback when the build cannot compile).

[tool.cibuildwheel]
# per-version wheels for every supported CPython, including free-threaded
# 3.13t/3.14t builds; PyPy users get the Python sdist fallback
build = "cp38-* cp39-* cp310-* cp311-* cp312-* cp313-* cp314-* cp315-* cp313t-* cp314t-*"
# extend the arch lists below to add more (e.g. manylinux i686/ppc64le/s390x,
# musllinux, windows arm64) -- one line each
skip = "*-musllinux_*"

[tool.cibuildwheel.linux]
archs = [ "x86_64", "aarch64" ]

[tool.cibuildwheel.macos]
archs = [ "x86_64", "arm64" ]

[tool.cibuildwheel.windows]
archs = [ "x86_64" ]
