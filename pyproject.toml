[build-system]
# setuptools >= 61 is the first version reading [tool.setuptools] from
# pyproject.toml; the upper bound is the last one supporting Python 3.8
# (setuptools 77 dropped 3.8), which this package still supports.
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=61,<78", "wheel" ]

[project]
name = "wcwidth"
version = "0.9.0"  # stamped into __init__.py and wcwidth_config.h by bin/update-tables.py
description = "Measures the displayed width of unicode strings in a terminal"
readme = "README.rst"
keywords = [
  "cjk",
  "combining",
  "console",
  "eastasian",
  "emoji",
  "emulator",
  "terminal",
  "unicode",
  "wcswidth",
  "wcwidth",
  "xterm",
]
# No [project] license key: the PEP 639 form needs setuptools>=77 (which drops
# Python 3.8) and the table form is deprecated there.  LICENSE reaches the
# wheel automatically on setuptools>=77, the sdist via MANIFEST.in.
authors = [
  { name = "Jeff Quast", email = "contact@jeffquast.com" },
]
requires-python = ">=3.8"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Software Development :: Internationalization",
  "Topic :: Software Development :: Libraries",
  "Topic :: Software Development :: Localization",
  "Topic :: Terminals",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/jquast/wcwidth"

[tool.setuptools]
include-package-data = false
packages = [
  "wcwidth",
  "wcwidth.table_grapheme_overrides",
]

[tool.setuptools.package-data]
wcwidth = [ "py.typed", "*.pyi" ]

# The optional C extension 'wcwidth._wcwidth_c' is declared in setup.py, which
# skips it when it cannot build (no compiler, PyPy, WCWIDTH_PYTHON=1).

[tool.cibuildwheel]
# Two pinned cibuildwheel lines build the matrix between them, because no single
# one covers it: 2.23.x keeps the glibc 2.17 manylinux image but stops at cp313,
# and 3.4.x knows cp314 but moves to glibc 2.28.  CIBW_BUILD selects each half
# (tox -e build-wheels / build-wheels314; the same split in wheels.yml), so this
# `build` is only the default for a bare cibuildwheel run.  PyPy uses the sdist.
build = "cp38-* cp39-* cp310-* cp311-* cp312-* cp313-* cp313t-*"
# Free-threaded x musllinux is skipped as unverified upstream.  Add further
# targets (i686/ppc64le/s390x, windows arm64) to the arch lists below.
skip = "cp313t-musllinux_* cp314t-musllinux_*"
# Test every built wheel.  {project} is the checked-out repo, since tests/ is
# not in the wheel.  --import-mode=importlib is required, or pytest puts
# {project} on sys.path ahead of site-packages and imports the source tree
# instead of the wheel.  pytest-cov satisfies the --cov flags in tox.ini.
test-requires = "pytest pytest-cov"
test-command = "python -m pytest {project}/tests --verbose --durations=10 --import-mode=importlib"

[tool.cibuildwheel.linux]
archs = [ "x86_64", "aarch64" ]

[tool.cibuildwheel.macos]
archs = [ "x86_64", "arm64" ]

[tool.cibuildwheel.windows]
# Windows archs are x86 / AMD64 / ARM64; "x86_64" matches no Windows config.
archs = [ "AMD64" ]
